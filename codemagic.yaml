
workflows:
  ios-workflow:
    name: Fasih Lugat iOS
    instance_type: mac_mini_m2
    max_build_duration: 60


    integrations:
      app_store_connect: FasihLugat-Codemagic


    environment:
      node: 22
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - FasihLugat-AppStore
        certificates:
          - FasihLugat-Distribution

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web application
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Resolve iOS packages
        script: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles --project ios/App/App.xcodeproj

      - name: Set iOS build number
        script: |
          cd ios/App
          agvtool new-version -all 2

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
