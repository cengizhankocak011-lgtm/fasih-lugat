workflows:
  ios-workflow:
    name: Fasih Lugat iOS
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      node: 22
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - FasihLugat-AppStore
        certificates:
          - FasihLugat-Distribution

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web application
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Install iOS dependencies
        script: |
          cd ios/App
          pod install

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles --project ios/App/App.xcodeproj

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
